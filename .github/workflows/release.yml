name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like v1.0.0"
            exit 1
          fi

          lua_version="$(sed -n "s/^addon.version = '\([^']*\)'.*/\1/p" scp.lua)"

          if [ "$lua_version" != "$version" ]; then
            echo "scp.lua version '$lua_version' does not match tag '$version'"
            exit 1
          fi

      - name: Package addon
        shell: bash
        run: |
          mkdir -p dist/scp

          cp \
            scp.lua \
            sc_data.lua \
            ws_data.lua \
            jobs.lua \
            engine.lua \
            high_scores.lua \
            LICENSE \
            NOTICE.md \
            README.md \
            dist/scp/

          cd dist
          zip -r "scp-${GITHUB_REF_NAME}.zip" scp

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/scp-${GITHUB_REF_NAME}.zip#SCP ${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "SCP ${GITHUB_REF_NAME}" \
            --generate-notes
